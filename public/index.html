<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>recipe thing</title>
<meta name="description" content="All your recipes in one place, written for your kitchen.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#150e0c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recipe Thing">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top" id="top"><div class="wrap" id="topin"></div></header>
<main id="view"></main>
<div id="selbar" class="selbar" hidden></div>
<button class="fab" id="fab" data-act="chat-open" aria-label="Ask the cook" hidden></button>
<div class="tabs"><nav id="tabs" aria-label="Sections"></nav></div>
<div id="layer"></div>
<div id="busy" class="busy" hidden></div>
<div class="timers" id="timers"></div>
<div id="toastbox" aria-live="polite"></div>
<input type="file" id="f-photo" accept="image/*" multiple hidden>
<input type="file" id="f-pdf" accept="application/pdf" hidden>
<input type="file" id="f-dish" accept="image/*" hidden>
<input type="file" id="f-backup" accept="application/json,.json" hidden>
<script src="/app.js"></script>
</body>
</html>
